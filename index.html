<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>明日衣卦 · 穿衣配色</title><script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.3/lunar.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell"><section class="hero"><div class="brand"><span class="seal">易</span><span>明日衣卦</span></div><p class="eyebrow">TAO · COLOR ORACLE</p><h1>以一身颜色<br>应明日之势</h1><p class="intro">从生辰、所愿与明日气象取象，化为一份轻盈的穿衣灵感。请以此为日常娱乐与自我整理，不替代任何现实决定。</p><div class="sun-disc"></div></section><section class="panel"><div class="step"><span>01</span><p>你的本命</p></div><form id="oracleForm"><div class="fields two"><label>姓名<input id="name" maxlength="12" placeholder="如何称呼你" required></label><label>性别<select id="gender"><option value="女">女</option><option value="男">男</option><option value="不设定">不设定</option></select></label></div><div class="date-tabs"><button type="button" class="active" data-mode="solar">公历生日</button><button type="button" data-mode="lunar">农历生日</button></div><div id="solarFields" class="fields two"><label>出生日期<input id="solarDate" type="date" required></label><label>出生时辰<select id="hour"></select></label></div><div id="lunarFields" class="fields three hidden"><label>年份<select id="lunarYear"></select></label><label>月<select id="lunarMonth"></select></label><label>日<select id="lunarDay"></select></label></div><p id="conversion" class="conversion">选择日期后，会在这里显示农历转换</p><div class="step second"><span>02</span><p>明日所求</p></div><label>你希望明日发生什么？<textarea id="wish" maxlength="100" placeholder="例如：顺利完成重要提案，与人沟通更从容…" required></textarea></label><button class="primary" type="submit"><span>起卦，查看明日配色</span><b>→</b></button></form></section></main>
<section id="result" class="result hidden"><div class="result-top"><div><p class="eyebrow">TOMORROW'S READING</p><h2><span id="resultName">你</span>的明日衣卦</h2></div><button id="reset" class="text-btn">重新起卦</button></div><div class="oracle-card"><div class="trigram"><div id="hexSymbol">☲</div><p id="hexName">离为火</p><small id="element">火行</small></div><div class="advice"><p class="label">明日的主色</p><h3 id="colorName">朱砂红</h3><div id="swatches" class="swatches"></div><p id="outfit" class="outfit"></p></div></div><div class="reading-grid"><article><p class="label">卦意</p><h3 id="readingTitle"></h3><p id="readingText"></p></article><article><p class="label">行动提示</p><ul id="tips"></ul></article></div><div class="poster-actions"><button id="poster" class="primary"><span>生成分享海报</span><b>↗</b></button><a id="download" class="hidden">下载海报</a></div></section>
<section id="posterCard" class="poster-card"><div class="poster-mark">易</div><p>明 日 衣 卦</p><h2 id="posterHex">离为火</h2><div id="posterColor" class="poster-color"></div><h3 id="posterName">朱砂红</h3><div class="poster-line"></div><div class="poster-bottom"><span id="posterDate"></span><span>TAO COLOR ORACLE</span></div></section><script src="app.js"></script></body></html>
